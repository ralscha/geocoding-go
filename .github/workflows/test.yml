name: Test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check module files
        run: |
          go mod tidy -diff
          go mod verify
      - name: Test with race detector
        run: go test -race -count=1 ./...
      - name: Static analysis
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=5m
      - name: Check known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Build container
        run: docker build --tag geocoding-go:ci .
      - name: Smoke-test container metadata
        run: docker run --rm geocoding-go:ci --version

  platform-test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test without cgo
        env:
          CGO_ENABLED: '0'
        run: go test -count=1 ./...
      - name: Test experimental SIMD
        env:
          CGO_ENABLED: '0'
          GOEXPERIMENT: simd
        run: go test -count=1 ./...
      - name: Test SIMD scalar fallback
        env:
          CGO_ENABLED: '0'
          GOEXPERIMENT: simd
          GODEBUG: simd=0
        run: go test -count=1 ./...
      - name: Build snapshot archives
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.2
          args: release --snapshot --clean
      - name: Smoke-test packaged host archive
        run: go run ./internal/releasesmoke -dist dist
